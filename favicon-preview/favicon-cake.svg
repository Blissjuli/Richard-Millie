<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="Birthday cake">
  <!-- ALTERNATE artwork, not wired up. Kept so the two candidates can be
       compared side by side. Measured at 16x16 this holds only ~22% gold
       coverage against the monogram's ~41%, so the tiers and drips turn to
       mush below 32px — which is why the monogram is the one in the <head>.
       To use this instead: swap the filenames in the icon <link> tags. -->
  <rect x="0" y="0" width="100" height="100" rx="22" fill="#090806"/>
  <polygon points="51,6 57,21 45,21" fill="#D8B76A"/>
  <rect x="48" y="20" width="6" height="14" rx="2.5" fill="#F5DDA0"/>
  <rect x="33" y="34" width="36" height="16" rx="4" fill="#D8B76A"/>
  <rect x="22" y="50" width="58" height="18" rx="5" fill="#D8B76A"/>
  <rect x="12" y="68" width="78" height="9" rx="4" fill="#F5DDA0"/>
</svg>
